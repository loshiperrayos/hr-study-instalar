
name: Build HR Study APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HR_Study_Android_Project_Phone.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o HR_Study_Android_Project_Phone.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare Android
        working-directory: extracted/HR_Study_Android_Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: extracted/HR_Study_Android_Project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HR-Study-APK
          path: extracted/HR_Study_Android_Project/android/app/build/outputs/apk/debug/app-debug.apk
          
