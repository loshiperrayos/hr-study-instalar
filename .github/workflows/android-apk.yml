name: Build HR Study APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HR_Study_Android_Project_Phone.zip'
      - 'HR_Study_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and extract project ZIP
        shell: bash
        run: |
          set -e
          if [ -f "HR_Study_Android_Project_Phone.zip" ]; then
            ZIP_FILE="HR_Study_Android_Project_Phone.zip"
          elif [ -f "HR_Study_Android_Project.zip" ]; then
            ZIP_FILE="HR_Study_Android_Project.zip"
          else
            echo "No encuentro el ZIP del proyecto en la raíz del repositorio."
            ls -la
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name package.json -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró package.json dentro del ZIP."
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install dependencies and prepare Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HR-Study-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
